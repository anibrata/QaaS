<main>
  <article>
    <p>Offense list for the data analyzed by DWave and QRadar</p>
  </article>
  <p>
    <button mat-raised-button class="refresh-button" (click)="refresh()">Refresh Table</button>
    <button mat-raised-button class="reset-filter" style="float: right;" (click)="clearFilterInput()">Reset Filter</button>
  </p>
  <!--<button mat-raised-button color="accent" (click)="refresh()">Update Table</button>-->
  <div class="mat-elevation-z8 qradar-class">

    <!--- The code below for mat table was commented and new code was added to make the columns to include functions that
    transform the values of the table;
    The change was taken care of inside the API itself and hence no change was needed -->
    <table
      mat-table
      matSort
      matSortActive="col.key"
      matSortDirection="asc"
      matSortDisableClear
      [dataSource]="dataSource"
      class="qradar-table"
    >

      <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">
        <th
          mat-header-cell
          mat-sort-header
          *matHeaderCellDef
          class="qradar-table-header"
        >
          {{ col.label }}
          <!-- <mat-form-field class="filter-field" *ngIf="isFilterable(col)"> -->
          <mat-form-field class="filter-field" *ngIf="col.filterable">
            <input matInput [mat-sort-header]="col.key" [formControl]="getFilterControl(col.key)" placeholder="Filter">
          </mat-form-field>
        </th>
        <td
          mat-cell
          *matCellDef="let element"
          class="qradar-table-cell"
        >
          {{ element[col.key] }}
        </td>
      </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <!--- The code below uses functions formatDate and formatTime to format the values of the single JSON value -->

                    showFirstLastButtons

</main>
