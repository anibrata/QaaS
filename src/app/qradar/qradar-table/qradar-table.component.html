    <!--- The code below uses functions formatDate and formatTime to format the values of the single JSON value -->
    <table mat-table [dataSource]="dataSource" class="qradar-table" matSort>
      <ng-container *ngFor="let col of columnsSchema" [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="qradar-table-header">
          {{ col.label }}
        </th>
        <td mat-cell *matCellDef="let element" class="qradar-table-cell">
          <ng-container [ngSwitch]="col.key">

            <!-- Use a switch case to format the value of the column -->
            <ng-container *ngSwitchCase="'start_time'">
              {{ formatDate(element[col.key]) }}
            </ng-container>

            <ng-container *ngSwitchCase="'start_date'">
              {{  formatTime(element.start_time) }}
            </ng-container>

            <ng-container *ngSwitchDefault>
              {{ element[col.key] }}
            </ng-container>
          </ng-container>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 15, 20]"
                    showFirstLastButtons
                    aria-label="Select Next or Back">
    </mat-paginator>

  </div>
