<main>
    <article>
      <p>Offense list for the data from the IoT sector.</p>
    </article>
  
    <!--<button mat-raised-button color="accent" (click)="refresh()">Update Table</button>-->
    <div class="mat-elevation-z8 iot-class">
  
      <table
        mat-table
        matSort
        matSortActive="col.key"
        matSortDirection="asc"
        matSortDisableClear
        [dataSource]="dataSource"
        class="iot-table"
      >
  
        <ng-container [matColumnDef]="col.key" *ngFor="let col of columnsSchema">
          <th
            mat-header-cell
            mat-sort-header
            *matHeaderCellDef
            class="iot-table-header"
          >
            {{ col.label }}
          </th>
          <td
            mat-cell
            *matCellDef="let element"
            class="iot-table-cell"
          >
            {{ element[col.key] }}
          </td>
        </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
  
      <mat-paginator [pageSizeOptions]="[5, 10, 15, 20]"
                      showFirstLastButtons
                      aria-label="Select Next or Back">
      </mat-paginator>
  
    </div>
  
  </main>
